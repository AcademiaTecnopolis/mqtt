<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 IoT Control</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #16213e, #050816 70%);

            color: white;
        }

        .contenedor {
            width: 90%;
            max-width: 450px;
        }

        .tarjeta {
            padding: 30px;

            background: rgba(20, 30, 60, 0.85);

            border: 1px solid rgba(0, 220, 255, 0.4);

            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(0, 220, 255, 0.15),
                0 0 50px rgba(0, 100, 255, 0.1);

            text-align: center;
        }

        h1 {
            margin-top: 0;

            font-size: 28px;

            letter-spacing: 2px;

            color: #00e5ff;

            text-shadow:
                0 0 10px rgba(0, 229, 255, 0.7);
        }

        .subtitulo {
            color: #9caacb;
            margin-bottom: 30px;
        }

        .dispositivo {
            padding: 15px;

            margin-bottom: 25px;

            background: rgba(0, 0, 0, 0.2);

            border-radius: 12px;
        }

        .dispositivo span {
            color: #00e5ff;
            font-weight: bold;
        }

        .led {
            width: 90px;
            height: 90px;

            margin: 25px auto;

            border-radius: 50%;

            background: #222;

            border: 3px solid #444;

            transition: 0.3s;
        }

        .led.encendido {

            background: #00ff88;

            border-color: #00ff88;

            box-shadow:
                0 0 15px #00ff88,
                0 0 40px #00ff88,
                0 0 80px rgba(0, 255, 136, 0.5);
        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #btnEncender {

            background: #00e5ff;

            color: #001018;

            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.4);
        }

        #btnEncender:hover {

            transform: scale(1.03);

            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.8);
        }

        #btnApagar {

            background: #252d45;

            color: white;
        }

        #btnApagar:hover {

            background: #353f60;

            transform: scale(1.03);
        }

        .estado {

            margin-top: 25px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(0, 0, 0, 0.25);

            color: #9caacb;
        }

        .estado span {
            font-weight: bold;
        }

        .conectado {
            color: #00ff88;
        }

        .desconectado {
            color: #ff5577;
        }

        footer {

            margin-top: 20px;

            color: #65718f;

            font-size: 12px;
           
            text-align: center;
        }

    </style>
</head>


<body>

    <div class="contenedor">

        <div class="tarjeta">

            <h1>ESP32 IoT</h1>

            <div class="subtitulo">
                Panel de control
            </div>


            <div class="dispositivo">

                Dispositivo:

                <span id="esp32ID">
                    ESP32_01
                </span>

            </div>


            <!-- LED VISUAL -->

            <div
                id="led"
                class="led">
            </div>


            <!-- BOTONES -->

            <button
                id="btnEncender"
                onclick="encenderLED()">

                💡 ENCENDER LED

            </button>


            <button
                id="btnApagar"
                onclick="apagarLED()">

                ⭕ APAGAR LED

            </button>


            <!-- ESTADO -->

            <div class="estado">

                Estado:

                <span id="estadoLED">
                    APAGADO
                </span>

            </div>


            <div class="estado">

                Conexión:

                <span
                    id="conexion"
                    class="desconectado">

                    DESCONOCIDO

                </span>

            </div>


        </div>


        <footer>

            Academia Tecnópilis@2026. | Proyecto IoT · ESP32 + Internet

        </footer>

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /*
    =====================================================
    CONFIGURACIÓN SUPABASE
    =====================================================
    */

    const SUPABASE_URL = "https://fulnhriijbipmcnhjuln.supabase.co";

    const SUPABASE_KEY = "sb_publishable_tHKQyunk-sp43ix95-K0Bw_gixGNRdY";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /*
    =====================================================
    CONFIGURACIÓN DEL ESP32
    =====================================================
    */

    const ESP32_ID = "ESP32_01";


    /*
    =====================================================
    ELEMENTOS DE LA PÁGINA
    =====================================================
    */

    const led =
        document.getElementById("led");

    const estadoLED =
        document.getElementById("estadoLED");

    const conexion =
        document.getElementById("conexion");

    const esp32ID =
        document.getElementById("esp32ID");


    esp32ID.textContent = ESP32_ID;


    /*
    =====================================================
    ENVIAR COMANDO A SUPABASE
    =====================================================
    */

    async function enviarComando(comando) {

        console.log(
            "Enviando:",
            ESP32_ID,
            comando
        );


        const { data, error } =
            await supabaseClient
                .from("comandos")
                .insert([
                    {
                        esp32_id: ESP32_ID,
                        comando: comando
                    }
                ]);


        if (error) {

            console.error(error);

            conexion.textContent =
                "ERROR";

            conexion.className =
                "desconectado";

            return;

        }


        console.log(
            "Comando enviado correctamente"
        );


        conexion.textContent =
            "CONECTADO";

        conexion.className =
            "conectado";

    }


    /*
    =====================================================
    ENCENDER LED
    =====================================================
    */

    async function encenderLED() {

        led.classList.add("encendido");

        estadoLED.textContent =
            "ENCENDIDO";


        await enviarComando("LED_ON");

    }


    /*
    =====================================================
    APAGAR LED
    =====================================================
    */

    async function apagarLED() {

        led.classList.remove("encendido");

        estadoLED.textContent =
            "APAGADO";


        await enviarComando("LED_OFF");

    }

</script>

</body>

</html>
